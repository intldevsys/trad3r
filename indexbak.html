<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Bot Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        }

        .card h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-running { background-color: #48bb78; }
        .status-stopped { background-color: #f56565; }
        .status-warning { background-color: #ed8936; }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid #f7fafc;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 500;
            color: #4a5568;
        }

        .metric-value {
            font-weight: 600;
            color: #2d3748;
        }

        .metric-value.positive {
            color: #38a169;
        }

        .metric-value.negative {
            color: #e53e3e;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ed8936 0%, #dd6b20 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            border-left: 4px solid;
        }

        .alert-high {
            background-color: #fed7d7;
            border-color: #f56565;
            color: #742a2a;
        }

        .alert-medium {
            background-color: #feebc8;
            border-color: #ed8936;
            color: #7b341e;
        }

        .alert-low {
            background-color: #c6f6d5;
            border-color: #48bb78;
            color: #22543d;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #718096;
        }

        .error {
            background-color: #fed7d7;
            color: #742a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .timestamp {
            font-size: 0.9rem;
            color: #718096;
            text-align: center;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .dashboard {
                grid-template-columns: 1fr;
            }

            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Crypto Trading Bot</h1>
            <p>Advanced Automated Trading System Dashboard</p>
        </div>

        <div class="dashboard">
            <!-- Bot Status Card -->
            <div class="card">
                <h3>🤖 Bot Status</h3>
                <div id="bot-status" class="loading">Loading...</div>
                <div class="controls">
                    <button class="btn btn-success" onclick="startBot()">Start Bot</button>
                    <button class="btn btn-danger" onclick="stopBot()">Stop Bot</button>
                    <button class="btn btn-primary" onclick="enableTrading()">Enable Trading</button>
                    <button class="btn btn-warning" onclick="disableTrading()">Disable Trading</button>
                </div>
            </div>

            <!-- Performance Metrics Card -->
            <div class="card">
                <h3>📈 Performance</h3>
                <div id="performance-metrics" class="loading">Loading...</div>
            </div>

            <!-- Active Alerts Card -->
            <div class="card">
                <h3>🚨 Active Alerts</h3>
                <div id="active-alerts" class="loading">Loading...</div>
            </div>

            <!-- System Health Card -->
            <div class="card">
                <h3>💚 System Health</h3>
                <div id="system-health" class="loading">Loading...</div>
            </div>
        </div>

        <div class="timestamp" id="last-updated">
            Last updated: Loading...
        </div>
    </div>

    <script>
        // API base URL
        const API_BASE = '/api/bot';

        // Utility functions
        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(value);
        }

        function formatPercentage(value) {
            return `${value.toFixed(2)}%`;
        }

        function getStatusIndicator(isRunning, isTrading) {
            if (isRunning && isTrading) {
                return '<span class="status-indicator status-running"></span>Running & Trading';
            } else if (isRunning) {
                return '<span class="status-indicator status-warning"></span>Running (Trading Disabled)';
            } else {
                return '<span class="status-indicator status-stopped"></span>Stopped';
            }
        }

        // API functions
        async function fetchData(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const data = await response.json();
                return data;
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return { success: false, error: error.message };
            }
        }

        async function postData(endpoint, data = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error(`Error posting to ${endpoint}:`, error);
                return { success: false, error: error.message };
            }
        }

        // Update functions
        async function updateBotStatus() {
            const result = await fetchData('/status');
            const container = document.getElementById('bot-status');

            if (result.success) {
                const status = result.data;
                container.innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Status:</span>
                        <span class="metric-value">${getStatusIndicator(status.running, status.trading_enabled)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Capital:</span>
                        <span class="metric-value">${formatCurrency(status.current_capital || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Daily P&L:</span>
                        <span class="metric-value ${(status.daily_pnl || 0) >= 0 ? 'positive' : 'negative'}">${formatCurrency(status.daily_pnl || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Total Trades:</span>
                        <span class="metric-value">${status.total_trades || 0}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Success Rate:</span>
                        <span class="metric-value">${formatPercentage(status.success_rate || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Active Positions:</span>
                        <span class="metric-value">${status.active_positions || 0}</span>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="error">Error: ${result.error}</div>`;
            }
        }

        async function updatePerformanceMetrics() {
            const result = await fetchData('/performance');
            const container = document.getElementById('performance-metrics');

            if (result.success) {
                const metrics = result.data;
                container.innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Total Return:</span>
                        <span class="metric-value ${(metrics.total_return_pct || 0) >= 0 ? 'positive' : 'negative'}">${formatPercentage(metrics.total_return_pct || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Daily Return:</span>
                        <span class="metric-value ${(metrics.daily_return_pct || 0) >= 0 ? 'positive' : 'negative'}">${formatPercentage(metrics.daily_return_pct || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Max Drawdown:</span>
                        <span class="metric-value negative">${formatPercentage(metrics.max_drawdown_pct || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Sharpe Ratio:</span>
                        <span class="metric-value">${(metrics.sharpe_ratio || 0).toFixed(2)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Win Rate:</span>
                        <span class="metric-value">${formatPercentage(metrics.win_rate || 0)}</span>
                    </div>
                    <div class="metric">
                        <span class="metric-label">Profit Factor:</span>
                        <span class="metric-value">${(metrics.profit_factor || 0).toFixed(2)}</span>
                    </div>
                `;
            } else {
                container.innerHTML = `<div class="error">Error: ${result.error}</div>`;
            }
        }

        async function updateActiveAlerts() {
            const result = await fetchData('/alerts');
            const container = document.getElementById('active-alerts');

            if (result.success) {
                const alerts = result.data;
                if (alerts.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: #48bb78; font-weight: 600;">✅ No active alerts</div>';
                } else {
                    container.innerHTML = alerts.map(alert => `
                        <div class="alert alert-${alert.severity}">
                            <strong>${alert.title}</strong><br>
                            ${alert.message}<br>
                            <small>${new Date(alert.timestamp).toLocaleString()}</small>
                        </div>
                    `).join('');
                }
            } else {
                container.innerHTML = `<div class="error">Error: ${result.error}</div>`;
            }
        }

        async function updateSystemHealth() {
            const result = await fetchData('/health');
            const container = document.getElementById('system-health');

            if (result.success) {
                const health = result.data;
                const isHealthy = health.status === 'healthy';
                
                container.innerHTML = `
                    <div class="metric">
                        <span class="metric-label">Overall Status:</span>
                        <span class="metric-value ${isHealthy ? 'positive' : 'negative'}">${health.status.toUpperCase()}</span>
                    </div>
                    ${Object.entries(health.components || {}).map(([component, status]) => `
                        <div class="metric">
                            <span class="metric-label">${component.replace('_', ' ').toUpperCase()}:</span>
                            <span class="metric-value ${status === 'healthy' ? 'positive' : 'negative'}">${status.toUpperCase()}</span>
                        </div>
                    `).join('')}
                `;
            } else {
                container.innerHTML = `<div class="error">Error: ${result.error}</div>`;
            }
        }

        // Control functions
        async function startBot() {
            const result = await postData('/start');
            if (result.success) {
                alert('Bot started successfully!');
                updateDashboard();
            } else {
                alert(`Error starting bot: ${result.error}`);
            }
        }

        async function stopBot() {
            const result = await postData('/stop');
            if (result.success) {
                alert('Bot stopped successfully!');
                updateDashboard();
            } else {
                alert(`Error stopping bot: ${result.error}`);
            }
        }

        async function enableTrading() {
            const result = await postData('/trading/enable');
            if (result.success) {
                alert('Trading enabled!');
                updateDashboard();
            } else {
                alert(`Error enabling trading: ${result.error}`);
            }
        }

        async function disableTrading() {
            const result = await postData('/trading/disable');
            if (result.success) {
                alert('Trading disabled!');
                updateDashboard();
            } else {
                alert(`Error disabling trading: ${result.error}`);
            }
        }

        // Main update function
        async function updateDashboard() {
            await Promise.all([
                updateBotStatus(),
                updatePerformanceMetrics(),
                updateActiveAlerts(),
                updateSystemHealth()
            ]);

            document.getElementById('last-updated').textContent = 
                `Last updated: ${new Date().toLocaleString()}`;
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            updateDashboard();
            
            // Auto-refresh every 30 seconds
            setInterval(updateDashboard, 30000);
        });
    </script>
</body>
</html>
